# ==============================================================================
# LEARNVERSE Production Nginx Configuration (Ubuntu 22.04 · 2 vCPU / 2 GiB RAM)
# Static Frontend + Reverse Proxy /api/* -> FastAPI (127.0.0.1:8000)
# ==============================================================================

upstream learnverse_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name learnverse.example.com _;

    root /var/www/learnverse/dist;
    index index.html;

    # Hide nginx version & OS banner in Server header and error pages
    server_tokens off;

    # Harden body size & timeouts against Slowloris / payload flood on 2C2G
    client_max_body_size 256k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 15s;

    # Lossless Gzip compression for JS/CSS/JSON/SVG/WASM (~70-80% smaller transfer size)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        application/wasm;

    # Global security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # 1. AI Q&A Server-Sent Events (SSE) - disable proxy & gzip buffering for real-time token streaming
    location /api/ai/ {
        proxy_pass http://learnverse_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        gzip off;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
    }

    # 2. General REST API & Code Sandbox (/api/auth, /api/sync, /api/github, /api/discussions, /api/sandbox, /api/local-runner)
    location /api/ {
        proxy_pass http://learnverse_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # 3. Never expose internal SQLite or dot-files
    location ~ /\.(?!well-known) {
        deny all;
    }
    location ~* \.(sqlite|sqlite3|db|wal|shm|env)$ {
        deny all;
    }

    # 4. Immutable static build assets, course/card WebP art & Vesper mascot stacked-alpha video assets
    location /assets/ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    location /art/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    location /mascot/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    # 5. SPA Fallback for React Router
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}
