[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "learnverse-backend"
version = "1.0.0"
description = "LEARNVERSE Unified High-Concurrency & Container-Hardened Production Backend (2C2G Optimized)"
readme = "../README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "argon2-cffi>=23.1.0",
    "bcrypt>=4.1.0",
    "PyJWT>=2.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
