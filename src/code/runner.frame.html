<!DOCTYPE html>
<meta charset="utf-8">
<!-- Blob workers inherit this policy within the frame's opaque origin. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval' blob:; worker-src blob:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<script>
  addEventListener('message', function start({ data, source, origin }) {
    if (source !== parent || data?.kind !== 'start' || typeof data.token !== 'string' || typeof data.workerSource !== 'string') return;
    removeEventListener('message', start);

    const { token, workerSource, input, assets } = data;
    function send(payload) {
      source.postMessage({ ...payload, token }, origin);
    }

    const workerURL = URL.createObjectURL(new Blob([workerSource], { type: 'text/javascript' }));
    let worker;
    try {
      worker = new Worker(workerURL);
    } catch (error) {
      URL.revokeObjectURL(workerURL);
      send({ kind: 'failure', message: error.message });
      return;
    }

    let disposed = false;
    function dispose() {
      if (disposed) return;
      disposed = true;
      worker.terminate();
      URL.revokeObjectURL(workerURL);
      removeEventListener('message', stop);
    }

    addEventListener('pagehide', dispose, { once: true });
    function stop({ data, source }) {
      if (source === parent && data?.kind === 'stop' && data.token === token) dispose();
    }
    addEventListener('message', stop);
    worker.onmessage = ({ data }) => {
      if (disposed || data?.token !== token) return;
      send(data);
      if (data.kind === 'done' || data.kind === 'failure') dispose();
    };
    worker.onerror = ({ message }) => {
      send({ kind: 'failure', message });
      dispose();
    };
    worker.postMessage({ input, assets, token });
  });
</script>
